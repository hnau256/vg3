name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - "docs/html/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site is built locally and committed (see docs/build.sh); CI only publishes it.
          path: docs/html
      - id: deployment
        uses: actions/deploy-pages@v4
