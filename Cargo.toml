[package]
name = "vg3"
version = "0.1.0"
edition = "2021"

[lib]
name = "vg3"
path = "src/lib.rs"

[[bin]]
name = "vg3"
path = "src/main.rs"

[dependencies]
blake3 = "1"
cxx = "1"
rhai = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[build-dependencies]
cxx-build = "1"
